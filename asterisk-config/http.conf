;
; Asterisk HTTP Server — minimal config
; =======================================
; Needed for Asterisk's built-in HTTP server (used by some modules).
; Not directly used by the bridge, but enables the Asterisk CLI HTTP
; interface for debugging.
;
; Docker mount example:
;   volumes:
;     - ./asterisk-config/http.conf:/etc/asterisk/http.conf:ro
;

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
prefix = asterisk
