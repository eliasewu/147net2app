;
; Asterisk Manager Interface — AMI configuration
; ================================================
; Used by asterisk-bridge.cjs to connect and manage calls.
; Mount this file into your Asterisk container at /etc/asterisk/manager.conf
;
; Docker mount example:
;   volumes:
;     - ./asterisk-config/manager.conf:/etc/asterisk/manager.conf:ro
;

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
; Allow up to 10 simultaneous AMI connections (bridge + debugging)
displayconnects = yes
timestampevents = yes

;
; Admin user — matches the credentials expected by asterisk-bridge.cjs
; and the POST /api/asterisk/servers registration endpoint.
;
; IMPORTANT: Change the secret in production!
;
[admin]
secret = net2app-ami-secret
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.0
permit = 172.16.0.0/255.240.0.0        ; Docker bridge network
permit = 192.168.0.0/255.255.0.0        ; Local LAN
read = system,call,log,verbose,command,agent,user,config,dtmf,originate
write = system,call,log,verbose,command,agent,user,config,dtmf,originate
eventfilter = !Event: Newexten
eventfilter = !Event: VarSet
eventfilter = !Event: Newchannel

;
; Read-only user for monitoring dashboards (optional)
;
[monitor]
secret = monitor-readonly
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.0
permit = 172.16.0.0/255.240.0.0
read = system,call,log,verbose,command,agent,user,config
write = system,call,log,verbose,command,agent,user,config
