# ============================================================
# .github/workflows/ci-gateway.yml — Java SMPP Gateway CI
# ============================================================
# Builds the Java 21 SMPP gateway fat JAR via Maven. Uploads
# the shaded jar as a CI artifact so every push to main and
# every PR produces a deployable binary without a local Maven
# install.
#
# Triggered on:
#   - every pull_request
#   - every push to main
#   - manual workflow_dispatch
# ============================================================
name: SMPP Gateway Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Java SMPP Gateway (mvn package)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (mvn package)
        run: mvn package --batch-mode
        working-directory: smpp-gateway

      - name: Upload SMPP gateway jar
        uses: actions/upload-artifact@v4
        with:
          name: smpp-gateway-jar
          path: smpp-gateway/target/smpp-gateway.jar
          if-no-files-found: error
